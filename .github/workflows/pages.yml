name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/assets/**"
      - "docs/.nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Only the website files — docs/ also holds markdown guides and
      # internal planning notes that must not be published.
      - name: Assemble site
        run: |
          mkdir _site
          cp docs/index.html docs/.nojekyll _site/
          cp -r docs/assets _site/assets

      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
