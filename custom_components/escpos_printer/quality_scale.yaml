rules:
  # Bronze
  action-setup:
    status: todo
    comment: >-
      Services are registered in async_setup_entry (gated on the first
      config entry) rather than async_setup. Calls still raise
      ServiceValidationError when no printer entries are loaded (see
      target_resolution); moving registration to async_setup to fully
      satisfy this rule is pending.
  appropriate-polling: done
  brands: done  # local brand images shipped under custom_components/escpos_printer/brand/ (HA 2026.3+ local-brands mechanism)
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Local integration with no authentication; reauth has nothing to refresh.
  test-coverage: todo  # currently ~70%; silver target is ≥95%

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: todo  # USB/BT discovery doesn't push updates into reconfigure yet
  discovery: done  # USB vendor IDs in manifest; Bluetooth uses manual MAC entry
  docs-data-update: todo
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: todo
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One device per config entry; no dynamic device set to manage.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done  # LastImagePrintSensor and BluetoothPrinterBatterySensor default disabled (diagnostic entities most users never enable)
  entity-translations: done  # entity section in strings.json + translations/en.json
  exception-translations: done  # 34 translation_key exceptions wired up in strings.json + translations/en.json
  icon-translations: done
  reconfiguration-flow: done  # async_step_reconfigure per transport (network/serial/usb/bluetooth) in main_flow.py + mixins
  repair-issues: done  # profile_width_fallback issue raised in printer/base_adapter.py
  stale-devices:
    status: exempt
    comment: One device per config entry; entry removal handles device cleanup.

  # Platinum
  async-dependency:
    status: exempt
    comment: Upstream python-escpos is synchronous; calls run via hass.async_add_executor_job with a per-adapter asyncio.Lock and asyncio.timeout boundaries.
  inject-websession:
    status: exempt
    comment: >-
      Printer transports are TCP sockets / pyusb / RFCOMM. aiohttp is
      used only for image-URL fetches, where a per-request session is
      built with a DNS-pinned connector (image_sources._StaticResolver)
      to defeat DNS rebinding; HA's shared session can't carry that
      pinning, so it cannot be injected here.
  strict-typing: todo  # mypy strict mode partial; integration imports lack full type coverage
